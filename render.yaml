services:
  # Backend API Service
  - type: web
    name: loan-engine-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Next.js Service
  - type: web
    name: loan-engine-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: front-end
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_URL
        value: https://loan-engine-api.onrender.com
